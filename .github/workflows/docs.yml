name: Documentation checks

# This repository is documentation, so Markdown defects are production defects.
# The checks in scripts/check-docs.mjs each exist because the defect they look
# for reached the default branch and was found by eye.
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'semantic/**/*.ttl'
      - 'semantic/**/*.json'
      - 'scripts/check-semantic-standard.py'
      - 'scripts/requirements-semantic.txt'
      - 'scripts/check-docs.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'semantic/**/*.ttl'
      - 'semantic/**/*.json'
      - 'scripts/check-semantic-standard.py'
      - 'scripts/requirements-semantic.txt'
      - 'scripts/check-docs.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci, not npm install: the mermaid pin is load-bearing, since the
      # point of the check is to reproduce the parser that rejects a diagram.
      # Pinning it in package.json alone would still let the transitive tree
      # resolve fresh on every run, so scripts/package-lock.json is committed
      # (with a .gitignore exception) and installed from.
      - name: Install check dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Check documentation
        run: node scripts/check-docs.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install semantic qualification dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-semantic.txt

      - name: Check semantic engineering profile
        run: python scripts/check-semantic-standard.py
